server:
  address: 127.0.0.1
  port: 8080

rag:
  upstream-base-url: ${RAG_UPSTREAM_BASE_URL:http://127.0.0.1:18000}

tryon:
  inference-base-url: ${RAG_UPSTREAM_BASE_URL:http://127.0.0.1:18000}
  internal-token: ${AGENT_INTERNAL_TOKEN:}
  worker-count: ${TRYON_WORKER_COUNT:4}
  queue-capacity: ${TRYON_QUEUE_CAPACITY:128}
  max-attempts: ${TRYON_MAX_ATTEMPTS:3}
  rate-limit-count: ${TRYON_RATE_LIMIT_COUNT:10}
  rate-limit-window: ${TRYON_RATE_LIMIT_WINDOW:10m}
  result-ttl: ${TRYON_RESULT_TTL:24h}
  saved-result-ttl: ${TRYON_SAVED_RESULT_TTL:168h}
  provider-timeout: ${TRYON_PROVIDER_TIMEOUT:90s}
  processing-lease: ${TRYON_PROCESSING_LEASE:2m}
  poll-interval-ms: ${TRYON_POLL_INTERVAL_MS:200}
  recovery-interval-ms: ${TRYON_RECOVERY_INTERVAL_MS:30000}
  result-signing-secret: ${VTO_RESULT_SIGNING_SECRET:replace-with-a-random-result-url-signing-secret}

catalog:
  upstream-base-url: ${CATALOG_UPSTREAM_BASE_URL:${RAG_UPSTREAM_BASE_URL:http://127.0.0.1:18000}}
  request-timeout: ${CATALOG_REQUEST_TIMEOUT:3s}

auth:
  jwt:
    secret: ${AUTH_JWT_SECRET:atelier-local-dev-secret-at-least-32-bytes}
    access-token-ttl: 2h

agent:
  internal-token: ${AGENT_INTERNAL_TOKEN:}

spring:
  application:
    name: atelier-java-backend
  profiles:
    default: local
  jpa:
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  cache:
    cache-names: orderLists
  cloud:
    gateway:
      httpclient:
        connect-timeout: 3000
        response-timeout: 120s
      routes:
        - id: python-chat-stream
          uri: ${rag.upstream-base-url}
          predicates:
            - Path=/api/chat/stream
          metadata:
            response-timeout: -1
        - id: python-api
          uri: ${rag.upstream-base-url}
          predicates:
            - Path=/api/request-id-probe,/api/chat,/api/session,/api/compare,/api/search/**,/api/products/**,/api/commerce/**,/api/actions/**,/api/agent/**,/api/tasks/**
        - id: python-media
          uri: ${rag.upstream-base-url}
          predicates:
            - Path=/media/**

management:
  prometheus:
    metrics:
      export:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
