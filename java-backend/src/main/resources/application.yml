server:
  address: 127.0.0.1
  port: 8080

rag:
  upstream-base-url: ${RAG_UPSTREAM_BASE_URL:http://127.0.0.1:18000}

auth:
  jwt:
    secret: ${AUTH_JWT_SECRET:atelier-local-dev-secret-at-least-32-bytes}
    access-token-ttl: 2h

agent:
  internal-token: ${AGENT_INTERNAL_TOKEN:}

spring:
  application:
    name: atelier-java-backend
  datasource:
    url: jdbc:h2:file:./data/atelier-java;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: atelier
    password: atelier
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  cloud:
    gateway:
      httpclient:
        connect-timeout: 3000
        response-timeout: 120s
      routes:
        - id: python-chat-stream
          uri: ${rag.upstream-base-url}
          predicates:
            - Path=/api/chat/stream
          metadata:
            response-timeout: -1
        - id: python-api
          uri: ${rag.upstream-base-url}
          predicates:
            - Path=/api/**
        - id: python-media
          uri: ${rag.upstream-base-url}
          predicates:
            - Path=/media/**

management:
  endpoints:
    web:
      exposure:
        include: health,metrics
