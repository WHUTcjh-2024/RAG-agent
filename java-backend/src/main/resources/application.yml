server:
  address: 127.0.0.1
  port: 8080

rag:
  upstream-base-url: ${RAG_UPSTREAM_BASE_URL:http://127.0.0.1:18000}

auth:
  jwt:
    secret: ${AUTH_JWT_SECRET:atelier-local-dev-secret-at-least-32-bytes}
    access-token-ttl: 2h

agent:
  internal-token: ${AGENT_INTERNAL_TOKEN:}

spring:
  application:
    name: atelier-java-backend
  profiles:
    default: local
  jpa:
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  cache:
    cache-names: orderLists
  cloud:
    gateway:
      httpclient:
        connect-timeout: 3000
        response-timeout: 120s
      routes:
        - id: python-chat-stream
          uri: ${rag.upstream-base-url}
          predicates:
            - Path=/api/chat/stream
          metadata:
            response-timeout: -1
        - id: python-api
          uri: ${rag.upstream-base-url}
          predicates:
            - Path=/api/**
        - id: python-media
          uri: ${rag.upstream-base-url}
          predicates:
            - Path=/media/**

management:
  prometheus:
    metrics:
      export:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
