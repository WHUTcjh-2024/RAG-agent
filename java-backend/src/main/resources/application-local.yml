server:
  address: 127.0.0.1
  port: 8080

rag:
  upstream-base-url: ${RAG_UPSTREAM_BASE_URL:http://127.0.0.1:18000}

auth:
  jwt:
    secret: ${AUTH_JWT_SECRET:atelier-local-dev-secret-at-least-32-bytes}
    access-token-ttl: 2h

spring:
  datasource:
    url: jdbc:h2:file:./data/atelier-java;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: atelier
    password: atelier
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
  cache:
    type: simple
