services:
  backend:
    build:
      context: ./backend
      args:
        BUILD_IMAGE_INDEX: ${BUILD_IMAGE_INDEX:-0}
    image: rag-agent-backend
    environment:
      IMAGE_DEVICE: cpu
      CATALOG_DIR: /app/data/tianchi-catalog
      CATALOG_IMAGE_DIR: /app/data/tianchi-catalog/images
      IMAGE_INDEX_DIR: /app/data/vector_store/image
      SESSION_DB_PATH: /app/data/sqlite/sessions.db
      AGENT_FACTS_BASE_URL: http://java-backend:8080
      AGENT_FACTS_INTERNAL_TOKEN: ${AGENT_INTERNAL_TOKEN:?Set AGENT_INTERNAL_TOKEN in .env}
      AGENT_CONTEXT_TOKEN: ${AGENT_INTERNAL_TOKEN:?Set AGENT_INTERNAL_TOKEN in .env}
      VTO_DB_PATH: /app/data/tryon/jobs.db
      VTO_MEDIA_DIR: /app/data/tryon/media
      VTO_PROVIDER_URL: ${VTO_PROVIDER_URL:-}
      VTO_PROVIDER_API_KEY: ${VTO_PROVIDER_API_KEY:-}
      VTO_RESULT_SIGNING_SECRET: ${VTO_RESULT_SIGNING_SECRET:-}
      VTO_REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      VTO_REDIS_PREFIX: fitme:vto
      VTO_S3_ENDPOINT_URL: http://minio:9000
      VTO_S3_BUCKET: ${MINIO_BUCKET:-fitme-tryon}
      VTO_S3_REGION: us-east-1
      VTO_S3_ACCESS_KEY: ${MINIO_ROOT_USER:?请设置 MINIO_ROOT_USER}
      VTO_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?请设置 MINIO_ROOT_PASSWORD}
    depends_on:
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    volumes:
      - ./backend/data/sqlite:/app/data/sqlite
      - ./backend/data/tryon:/app/data/tryon
    # 仅供 Docker 内部服务（Java 网关）访问，禁止绕过网关直连。
    expose:
      - "18000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; assert urllib.request.urlopen('http://127.0.0.1:18000/health').status == 200"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 30s
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?请设置 POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?请设置 POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请设置 POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
  redis:
    image: redis:7-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?请设置 REDIS_PASSWORD}
      REDIS_MAXMEMORY: ${REDIS_MAXMEMORY:-256mb}
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --maxmemory \"$$REDIS_MAXMEMORY\" --maxmemory-policy allkeys-lru"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?请设置 MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?请设置 MINIO_ROOT_PASSWORD}
    command: ["server", "/data", "--console-address", ":9001"]
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
  minio-init:
    image: minio/mc:RELEASE.2025-07-21T05-28-08Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?请设置 MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?请设置 MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-fitme-tryon}
    entrypoint:
      - /bin/sh
      - -c
      - >-
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" &&
        mc mb --ignore-existing "local/$$MINIO_BUCKET" &&
        mc anonymous set none "local/$$MINIO_BUCKET"
  tryon-worker:
    image: rag-agent-backend
    command: ["python", "-m", "app.workers.virtual_try_on"]
    depends_on:
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      CATALOG_DIR: /app/data/tianchi-catalog
      CATALOG_IMAGE_DIR: /app/data/tianchi-catalog/images
      VTO_PROVIDER_URL: ${VTO_PROVIDER_URL:?请设置 VTO_PROVIDER_URL}
      VTO_PROVIDER_API_KEY: ${VTO_PROVIDER_API_KEY:-}
      VTO_RESULT_SIGNING_SECRET: ${VTO_RESULT_SIGNING_SECRET:?请设置 VTO_RESULT_SIGNING_SECRET}
      VTO_REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      VTO_REDIS_PREFIX: fitme:vto
      VTO_S3_ENDPOINT_URL: http://minio:9000
      VTO_S3_BUCKET: ${MINIO_BUCKET:-fitme-tryon}
      VTO_S3_REGION: us-east-1
      VTO_S3_ACCESS_KEY: ${MINIO_ROOT_USER:?请设置 MINIO_ROOT_USER}
      VTO_S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?请设置 MINIO_ROOT_PASSWORD}
  java-backend:
    build: ./java-backend
    depends_on:
      backend:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_ADDRESS: 0.0.0.0
      RAG_UPSTREAM_BASE_URL: http://backend:18000
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?请设置 AUTH_JWT_SECRET}
      AGENT_INTERNAL_TOKEN: ${AGENT_INTERNAL_TOKEN:?Set AGENT_INTERNAL_TOKEN in .env}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}
    # 仅供前端反向代理访问；对外入口统一由 frontend 提供。
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
  frontend:
    build: ./frontend
    depends_on:
      java-backend:
        condition: service_healthy
    ports:
      - "5173:80"

volumes:
  postgres-data:
  minio-data:
