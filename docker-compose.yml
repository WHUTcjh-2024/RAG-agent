services:
  backend:
    build:
      context: ./backend
      args:
        BUILD_IMAGE_INDEX: ${BUILD_IMAGE_INDEX:-0}
    image: rag-agent-backend
    environment:
      IMAGE_DEVICE: cpu
      CATALOG_DIR: /app/data/tianchi-catalog
      CATALOG_IMAGE_DIR: /app/data/tianchi-catalog/images
      IMAGE_INDEX_DIR: /app/data/vector_store/image
      SESSION_DB_PATH: /app/data/sqlite/sessions.db
      AGENT_MEMORY_BACKEND: ${AGENT_MEMORY_BACKEND:-sqlite}
      AGENT_MEMORY_DATABASE_URL: ${AGENT_MEMORY_DATABASE_URL:-}
      AGENT_MEMORY_AUTO_SETUP: ${AGENT_MEMORY_AUTO_SETUP:-false}
      # Production mode is explicit. Local compose keeps the deterministic
      # SQLite implementation unless these values are overridden in `.env`.
      AGENT_CHECKPOINT_BACKEND: ${AGENT_CHECKPOINT_BACKEND:-sqlite}
      AGENT_CHECKPOINT_DATABASE_URL: ${AGENT_CHECKPOINT_DATABASE_URL:-}
      AGENT_CHECKPOINT_AUTO_SETUP: ${AGENT_CHECKPOINT_AUTO_SETUP:-false}
      AGENT_TASK_LOCK_BACKEND: ${AGENT_TASK_LOCK_BACKEND:-local}
      AGENT_REDIS_URL: ${AGENT_REDIS_URL:-redis://:${REDIS_PASSWORD}@redis:6379/2}
      AGENT_TASK_LOCK_PREFIX: ${AGENT_TASK_LOCK_PREFIX:-atelier:agent:task-lock}
      AGENT_TASK_LOCK_TTL_SECONDS: ${AGENT_TASK_LOCK_TTL_SECONDS:-90}
      AGENT_TASK_LOCK_ACQUIRE_TIMEOUT_SECONDS: ${AGENT_TASK_LOCK_ACQUIRE_TIMEOUT_SECONDS:-3}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-atelier-agent-api}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
      AGENT_FACTS_BASE_URL: http://java-backend:8080
      AGENT_FACTS_INTERNAL_TOKEN: ${AGENT_INTERNAL_TOKEN:?Set AGENT_INTERNAL_TOKEN in .env}
      AGENT_CONTEXT_TOKEN: ${AGENT_INTERNAL_TOKEN:?Set AGENT_INTERNAL_TOKEN in .env}
      AGENT_INTERNAL_TOKEN: ${AGENT_INTERNAL_TOKEN:?Set AGENT_INTERNAL_TOKEN in .env}
      VTO_PROVIDER_URL: ${VTO_PROVIDER_URL:-}
      VTO_PROVIDER_API_KEY: ${VTO_PROVIDER_API_KEY:-}
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./backend/data/sqlite:/app/data/sqlite
    # 仅供 Docker 内部服务（Java 网关）访问，禁止绕过网关直连。
    expose:
      - "18000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; assert urllib.request.urlopen('http://127.0.0.1:18000/health').status == 200"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 30s
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?请设置 POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?请设置 POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?请设置 POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
  redis:
    image: redis:7-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?请设置 REDIS_PASSWORD}
      REDIS_MAXMEMORY: ${REDIS_MAXMEMORY:-256mb}
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\" --maxmemory \"$$REDIS_MAXMEMORY\" --maxmemory-policy allkeys-lru"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 5s
  java-backend:
    build: ./java-backend
    depends_on:
      backend:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SERVER_ADDRESS: 0.0.0.0
      RAG_UPSTREAM_BASE_URL: http://backend:18000
      TRYON_WORKER_COUNT: ${TRYON_WORKER_COUNT:-4}
      TRYON_QUEUE_CAPACITY: ${TRYON_QUEUE_CAPACITY:-128}
      TRYON_MAX_ATTEMPTS: ${TRYON_MAX_ATTEMPTS:-3}
      TRYON_RATE_LIMIT_COUNT: ${TRYON_RATE_LIMIT_COUNT:-10}
      TRYON_RATE_LIMIT_WINDOW: ${TRYON_RATE_LIMIT_WINDOW:-10m}
      TRYON_RESULT_TTL: ${TRYON_RESULT_TTL:-24h}
      TRYON_SAVED_RESULT_TTL: ${TRYON_SAVED_RESULT_TTL:-168h}
      TRYON_PROVIDER_TIMEOUT: ${TRYON_PROVIDER_TIMEOUT:-90s}
      TRYON_PROCESSING_LEASE: ${TRYON_PROCESSING_LEASE:-2m}
      VTO_RESULT_SIGNING_SECRET: ${VTO_RESULT_SIGNING_SECRET:?Set VTO_RESULT_SIGNING_SECRET in .env}
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?请设置 AUTH_JWT_SECRET}
      AGENT_INTERNAL_TOKEN: ${AGENT_INTERNAL_TOKEN:?Set AGENT_INTERNAL_TOKEN in .env}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}
    # 仅供前端反向代理访问；对外入口统一由 frontend 提供。
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
  frontend:
    build: ./frontend
    depends_on:
      java-backend:
        condition: service_healthy
    ports:
      - "5173:80"

volumes:
  postgres-data:
